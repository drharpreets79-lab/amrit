{% extends "dashboard/base.html" %}
{% block title %}New action plan · AMRIT Central{% endblock %}

{% block content %}
<a href="{% url 'action_inbox' %}" class="text-xs text-brand-blue-700 font-semibold hover:underline">← Back to inbox</a>
<h1 class="mt-3 font-display text-2xl font-extrabold text-brand-navy-700 mb-1">Author an action plan</h1>
<p class="text-sm text-slate-500 mb-6">Manually raise a plan and address it to a stakeholder role &amp; scope. It is issued immediately.</p>

<form method="post" class="bg-white rounded-xl border border-slate-200 shadow-card p-6 max-w-3xl space-y-5">
  {% csrf_token %}
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1">Title</label>
    <input name="title" required class="w-full border border-slate-300 rounded-md px-3 py-2" placeholder="e.g. Ceftriaxone stewardship drive — intensive care network">
  </div>
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1">Summary</label>
    <textarea name="summary" rows="3" class="w-full border border-slate-300 rounded-md px-3 py-2" placeholder="Context and rationale for this plan…"></textarea>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Scope</label>
      <select name="scope_type" class="w-full border border-slate-300 rounded-md px-3 py-2">
        {% for val, label in scope_choices %}<option value="{{ val }}" {% if val == default_scope_type %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Scope value</label>
      <input name="scope_value" value="{{ default_scope_value }}" class="w-full border border-slate-300 rounded-md px-3 py-2" placeholder="administrative code or lab code (blank = country)">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Severity</label>
      <select name="severity" class="w-full border border-slate-300 rounded-md px-3 py-2">
        {% for val, label in severity_choices %}<option value="{{ val }}" {% if val == 'moderate' %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Addressed to role</label>
      <select name="target_role" class="w-full border border-slate-300 rounded-md px-3 py-2">
        <option value="">— any —</option>
        {% for val, label in role_choices %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Due date</label>
      <input name="due_date" type="date" class="w-full border border-slate-300 rounded-md px-3 py-2">
    </div>
  </div>
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1">Action points (one per line)</label>
    <textarea name="points" rows="5" class="w-full border border-slate-300 rounded-md px-3 py-2" placeholder="Convene stewardship committee&#10;Audit ICU carbapenem use&#10;Reinforce hand-hygiene bundle"></textarea>
  </div>
  <div class="flex items-center gap-2">
    <button class="px-4 py-2 rounded-md bg-brand-accent-500 text-white font-semibold">Create &amp; issue plan</button>
    <a href="{% url 'action_inbox' %}" class="px-4 py-2 rounded-md border border-slate-300 text-slate-600">Cancel</a>
  </div>
</form>
{% endblock %}
